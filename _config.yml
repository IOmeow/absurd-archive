title: 荒謬檔案館
tagline: General Archive · Est. 1961
description: 綜合條目索引

# 條目於每日凌晨 3:00（台北）產生，date 為當天日期。
# 若不設時區，Jekyll 以 UTC 解讀日期，凌晨 3:00 台北（前一日 19:xx UTC）
# 會判定當天日期的條目為「未來」而不產生頁面（列在索引卻 404）。
# 設定台北時區並允許未來日期，確保條目當場發布。
timezone: Asia/Taipei
future: true

# ---------------------------------------------------------------------------
# 網址設定
# 專案型 GitHub Pages（username.github.io/absurd-archive）請保留 baseurl。
# 若日後改用自訂網域或 username.github.io 根目錄，把 baseurl 改成空字串 ""。
# ---------------------------------------------------------------------------
baseurl: "/absurd-archive"
url: "https://iomeow.github.io"

# 條目集合：每則 _entries/*.md 會產生 /entries/<檔名>/ 這個網址
collections:
  entries:
    output: true
    permalink: /entries/:name/

defaults:
  - scope:
      path: ""
      type: entries
    values:
      layout: entry

markdown: kramdown
kramdown:
  footnote_nr: 1
  entity_output: as_char

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
